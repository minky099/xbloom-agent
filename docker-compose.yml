services:
  xbloom-mcp:
    build: .
    image: xbloom-mcp:latest
    container_name: xbloom-mcp
    ports:
      # Host:container — 2566 spells "BLOOM" on a phone keypad.
      - "2566:2566"
    environment:
      # Required: secret used to encrypt stored sessions at rest.
      # Use a long random string, e.g. `openssl rand -hex 32`.
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      # Optional: public URL this server is reachable at (OAuth discovery).
      # Leave unset for local use.
      MCP_BASE_URL: ${MCP_BASE_URL:-}
    volumes:
      # Persist the self-contained Deno KV session store across restarts.
      - xbloom-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "deno", "eval", "-A", "const r = await fetch('http://localhost:2566/'); if (!r.ok) Deno.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  xbloom-data:
